asyncapi: 3.0.0
info:
  title: Lorum (Fuse) Webhooks
  version: 1.0.0
  description: Real-time webhook events emitted by Lorum for payments, transfers, currency exchanges,
    account changes, and customer onboarding. Generated from the provider's published webhook catalogue
    (docs.lorum.com/docs/webhook-catalogue). Events are pushed to a single configured URL; categories
    are opt-in; retries use exponential backoff for up to 12 hours; deduplicate on event_id.
  x-generated: '2026-07-20'
  x-method: generated
  x-source: https://docs.lorum.com/docs/webhook-catalogue
channels:
  webhooks:
    address: '{configuredWebhookUrl}'
    title: Organisation webhook endpoint
    description: A single URL configured in the Lorum portal (Settings > App) that receives all enabled
      webhook categories.
    messages:
      account_opened:
        $ref: '#/components/messages/account_opened'
      account_updated:
        $ref: '#/components/messages/account_updated'
      outbound_local_payment_created:
        $ref: '#/components/messages/outbound_local_payment_created'
      outbound_local_payment_submitted:
        $ref: '#/components/messages/outbound_local_payment_submitted'
      outbound_local_payment_executed:
        $ref: '#/components/messages/outbound_local_payment_executed'
      outbound_local_payment_failed:
        $ref: '#/components/messages/outbound_local_payment_failed'
      outbound_local_payment_returned:
        $ref: '#/components/messages/outbound_local_payment_returned'
      inbound_local_payment_settled:
        $ref: '#/components/messages/inbound_local_payment_settled'
      fee_debited:
        $ref: '#/components/messages/fee_debited'
      internal_transfer_created:
        $ref: '#/components/messages/internal_transfer_created'
      inbound_internal_transfer_settled:
        $ref: '#/components/messages/inbound_internal_transfer_settled'
      internal_transfer_settled:
        $ref: '#/components/messages/internal_transfer_settled'
      internal_transfer_failed:
        $ref: '#/components/messages/internal_transfer_failed'
      outbound_exchange_transfer_created:
        $ref: '#/components/messages/outbound_exchange_transfer_created'
      outbound_exchange_transfer_submitted:
        $ref: '#/components/messages/outbound_exchange_transfer_submitted'
      outbound_exchange_transfer_executed:
        $ref: '#/components/messages/outbound_exchange_transfer_executed'
      inbound_exchange_transfer_settled:
        $ref: '#/components/messages/inbound_exchange_transfer_settled'
      outbound_exchange_transfer_failed:
        $ref: '#/components/messages/outbound_exchange_transfer_failed'
      onboarding_completed:
        $ref: '#/components/messages/onboarding_completed'
      onboarding_failed:
        $ref: '#/components/messages/onboarding_failed'
operations:
  receiveWebhook:
    action: receive
    channel:
      $ref: '#/channels/webhooks'
    summary: Receive Lorum webhook events.
    messages:
    - $ref: '#/components/messages/account_opened'
    - $ref: '#/components/messages/account_updated'
    - $ref: '#/components/messages/outbound_local_payment_created'
    - $ref: '#/components/messages/outbound_local_payment_submitted'
    - $ref: '#/components/messages/outbound_local_payment_executed'
    - $ref: '#/components/messages/outbound_local_payment_failed'
    - $ref: '#/components/messages/outbound_local_payment_returned'
    - $ref: '#/components/messages/inbound_local_payment_settled'
    - $ref: '#/components/messages/fee_debited'
    - $ref: '#/components/messages/internal_transfer_created'
    - $ref: '#/components/messages/inbound_internal_transfer_settled'
    - $ref: '#/components/messages/internal_transfer_settled'
    - $ref: '#/components/messages/internal_transfer_failed'
    - $ref: '#/components/messages/outbound_exchange_transfer_created'
    - $ref: '#/components/messages/outbound_exchange_transfer_submitted'
    - $ref: '#/components/messages/outbound_exchange_transfer_executed'
    - $ref: '#/components/messages/inbound_exchange_transfer_settled'
    - $ref: '#/components/messages/outbound_exchange_transfer_failed'
    - $ref: '#/components/messages/onboarding_completed'

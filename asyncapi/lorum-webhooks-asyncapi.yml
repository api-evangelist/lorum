components:
  messages:
    account_opened:
      name: account_opened
      title: Account Opened
      summary: 'Lorum ''account_opened'' webhook event (category: account).'
      contentType: application/json
      headers:
        type: object
        properties:
          X-Fuse-Timestamp:
            type: string
            format: date-time
            description: ISO-8601 time the webhook was sent.
      payload:
        type: object
        required:
        - type
        - event_id
        - event_version
        - account_opened
        properties:
          type:
            type: string
            const: account_opened
          event_id:
            type: string
            format: uuid
          event_version:
            type: integer
          account_opened:
            type: object
            description: Event-specific payload nested under the event type name.

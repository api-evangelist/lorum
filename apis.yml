aid: lorum
name: Lorum
description: >-
  Lorum (developer brand "Fuse") is a fintech providing banking-grade clearing,
  settlement, and treasury infrastructure - "built for clearing, not lending."
  Through one API it offers multi-currency clearing across 30+ markets,
  programmable segregated account infrastructure (including virtual IBANs), and
  cash management with FX and liquidity sweeps. It targets payroll/EOR
  platforms, fintechs and PSPs, trading and investment platforms, and
  marketplaces that need to move and settle funds across global payment rails
  without standing up local banking entities. The API (OAuth2 client-credentials
  auth, idempotency-keyed money movement, and webhook event notifications)
  covers customers/KYC, accounts, payments, internal transfers, currency
  exchange, documents, batch payments, and full sandbox scheme simulation. Lorum
  is backed by Northzone.

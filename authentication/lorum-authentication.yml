  notes: >-
    Lorum (Fuse) uses the OAuth 2.0 client credentials grant to mint a JWT
    bearer access_token, which is then presented as `Authorization: Bearer
    <token>` on every API call. Tokens are valid for 3 hours and MUST be cached
    and reused - integrations that request a new token per call are not
    certified for production. The authorization server is Auth0-backed.
